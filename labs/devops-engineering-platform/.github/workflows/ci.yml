name: DevOps Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: labs/devops-engineering-platform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: labs/devops-engineering-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-platform:ci .
        